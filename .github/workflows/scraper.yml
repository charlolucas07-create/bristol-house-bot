name: House Search Scraper

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo content
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit & Push updated seen list
        run: |
          git config user.name 'HouseBot'
          git config user.email 'housebot@users.noreply.github.com'
          git add seen_properties.txt
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update seen properties list [skip ci]"
          git pull --rebase origin main
          git push
